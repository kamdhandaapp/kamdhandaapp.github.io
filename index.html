*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 "Noto Sans Devanagari",system-ui,sans-serif;max-width:480px;margin:0 auto;padding:0 14px 96px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0}

.lang{display:flex;gap:6px}.lang button,.sp{min-width:44px;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700}
.lang button.on{background:var(--yl);border-color:var(--yl);color:#111}
.hero{text-align:center;padding:18px 0}
.mic{width:128px;height:128px;border-radius:50%;border:0;background:var(--or);font-size:54px;box-shadow:0 0 0 10px rgba(255,138,0,.2)}

.mut{color:var(--mut);margin:4px 0}
.col{display:flex;flex-direction:column;gap:12px;margin:12px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:62px;padding:10px 16px;border-radius:16px;border:0;background:var(--or);color:#111;font:inherit;font-size:19px;font-weight:700;text-decoration:none}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.done{background:#2e9e5b;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.cat{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:84px;padding:8px 4px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:30px}
.cat span{font-size:13px;font-weight:700;text-align:center;line-height:1.2}
.cat.on{border-color:var(--or);background:rgba(255,138,0,.15)}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}
.ct{font-size:20px;font-weight:800}
.row{display:flex;gap:10px}.row>*{flex:1}
.thumbs{display:flex;gap:6px;margin:8px 0;overflow-x:auto}.thumbs img{width:96px;height:96px;object-fit:cover;border-radius:12px}
label{display:block;margin:14px 0 4px;font-weight:700}
.f{display:flex;gap:8px}
input,select,textarea{flex:1;width:100%;min-height:54px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.m{min-width:54px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:24px}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.x{border:0;background:none;font-size:20px;color:var(--ink)}
#msg{display:none;position:fixed;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 8px);max-width:452px;margin:0 auto;background:#111;color:#fff;padding:14px;border-radius:14px;text-align:center;font-weight:700;z-index:9}
nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-height:64px;border:0;background:none;color:var(--mut);font:inherit;font-size:13px;font-weight:700}
nav button b{display:block;font-size:24px}
nav button.on{color:var(--or)}
.demo{background:var(--yl);color:#111;border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700}

return`<div class="card"><div class="ct">${esc(me.name||"")} ${rt(uid)}</div><div class="mut">📍 ${esc([me.city,me.state].filter(Boolean).join(", "))} · 📱 ${esc(me.phone||"")} (${tt("nv")})</div>${me.edu?`<div class="mut">🎓 ${esc(me.edu)}${me.course?" · "+esc(me.course):""}</div>`:""}</div><h3>${tt("myskills")}</h3>`+((me.skills||[]).map(s=>`<div class="card"><b>${esc(s.n)}</b><div class="mut">${esc(s.y||0)} ${L==2?"yrs":L?"वर्षे":"साल"} · ${tt("l"+(s.l||1))}</div>${s.d?`<div>${esc(s.d)}</div>`:""}</div>`).join("")||`<p class="empty">${t("none")}</p>`)+`<h3>${tt("applied2")}</h3>`+(my.length?my.map(a=>{const j=S.jobs.find(j=>j.id==a.jobId);return`<div class="card"><b>${j?esc(j.title):""}</b> ${j?rt(j.owner):""}<div class="mut">${j?"📍 "+esc(j.place):""}</div><div>${SLT(a.status||"applied")}</div>${a.msg?`<div class="demo" style="margin-top:6px">${tt("msgfrom")}: ${esc(a.msg)}</div>`:""}${dealBox(a,0)}${dealDone(a)&&j?`<button class="btn alt" style="min-height:48px;margin-top:8px" onclick="rv={to:'${j.owner}'};render();scrollTo(0,0)">${t("rate")}</button>`:""}</div>`}).join(""):`<p class="empty">${tt("noapp")}</p>`)};
const _at=window.attach;window.attach=function(api){const w=api.watch;api.watch=(c,cb)=>w(c,r=>{if(c=="workers")LW=1;cb(r)});_at(api)};
document.head.insertAdjacentHTML("beforeend","<style>.lang button:not(.sp){display:none}#bc{color:var(--or)}</style>");
document.querySelector(".lang").insertAdjacentHTML("afterbegin",'<button class="sp" onclick="nv(\'career\')">🔔<sup id="bc"></sup></button>');
const _render=render;
render=function(){const me=S.workers.find(w=>w.id==uid);
if(!me&&((!db&&BOOT)||(db&&!LW))){$("#app").innerHTML='<p class="empty">…</p>';$("nav").style.display="none";return}
const gate=!me;$("nav").style.display=gate?"none":"";document.querySelector(".lang").style.display=gate?"none":"";
if(gate){$("#app").innerHTML=obHtml();$("#demo").innerHTML=db?"":`<div class="demo">${t("demo")}</div>`;return}
_render();const nb=$("nav").children,lb=["hm","kaam","car","mine"],em=["🏠","🧰","🚀","👤"],vw=["home","jobs","career","me"];
for(let i=0;i<4;i++){nb[i].querySelector("b").textContent=em[i];nb[i].querySelector("i").textContent=tt(lb[i]);nb[i].className=(view==vw[i]||(i==1&&view=="workers"))?"on":""}
nb[2].onclick=()=>nv("career");const n=S.apps.filter(a=>a.wid==uid&&a.status&&a.status!="applied"&&!a.seenW).length;$("#bc").textContent=n||""};
setTimeout(()=>{BOOT=0;if(db&&!LW)LW=1;render()},3000);
render();
</script>

<script>
/* ===== v3: work agreement + payment tracker (no money is held by the app) ===== */
Object.assign(TT,{
deal:["📝 काम का समझौता","📝 कामाचा करार","📝 Work agreement"],
dnote:["यह भुगतान ट्रैकर है। पैसा सीधे आप दोनों के बीच जाता है, ऐप पैसा नहीं रखता।","हा पेमेंट ट्रॅकर आहे. पैसे थेट तुमच्या दोघांमध्ये जातात, अ‍ॅप पैसे ठेवत नाही.","This is a payment tracker. Money goes directly between you two; the app does not hold money."],
dterms:["शर्तें (समय, छुट्टी, काम का ब्यौरा)","अटी (वेळ, सुट्टी, कामाचा तपशील)","Terms (hours, leave, work details)"],
dlab:["किश्त का नाम","हप्त्याचे नाव","Installment name"],damt:["रक़म ₹","रक्कम ₹","Amount ₹"],
dsend:["समझौता भेजें","करार पाठवा","Send agreement"],dagree:["✔ शर्तें और रक़म मंज़ूर","✔ अटी आणि रक्कम मान्य","✔ Accept terms and amount"],
dwait:["कारीगर की मंज़ूरी का इंतज़ार","कामगाराच्या मान्यतेची वाट","Waiting for worker to accept"],
dwdone:["काम हो गया","काम झाले","Work done"],dpay:["ठीक है, पैसा भेज दिया","ठीक आहे, पैसे पाठवले","Work OK, payment sent"],drecv:["पैसा मिल गया","पैसे मिळाले","Payment received"],
ddone:["✔ पूरा हुआ","✔ पूर्ण झाले","✔ Completed"],
ddisp:["⚠️ विवाद / शिकायत दर्ज करें","⚠️ वाद / तक्रार नोंदवा","⚠️ Report a problem"],ddt:["क्या हुआ? लिखिए","काय झाले? लिहा","What happened?"],dok:["दर्ज हो गया ✔","नोंदवले ✔","Recorded ✔"],
dfirst:["काम शुरू पर","काम सुरू करताना","On starting work"],dsecond:["काम पूरा होने पर","काम पूर्ण झाल्यावर","On finishing work"],
dlock:["रेटिंग तब खुलेगी जब काम पूरा हो और पैसा मिल जाए","रेटिंग काम पूर्ण आणि पैसे मिळाल्यावर उघडेल","Rating opens when work is done and payment received"]});
const DF={},DS={},inl=(a,k)=>a[k]||[];
function dealDone(a){const d=a.deal;return !!(d&&d.ms&&d.ms.length&&d.ms.every((m,i)=>inl(a,"oPaid").includes(i)&&inl(a,"wRecv").includes(i)))}
function upd(id,f){const a=S.apps.find(x=>x.id==id);if(!a)return;const d=Object.assign({},a,f);delete d.id;wr("apps",id,d)}
function dealForm(a){const f=DF[a.id]||(DF[a.id]={t:"",r:[{l:tt("dfirst"),a:""},{l:tt("dsecond"),a:""}]});
return`<div class="card" style="margin:8px 0"><b>${tt("deal")}</b><input style="margin-top:6px" placeholder="${tt("dterms")}" value="${esc(f.t)}" oninput="DF['${a.id}'].t=this.value">`+f.r.map((r,i)=>`<div class="row" style="margin-top:6px"><input placeholder="${tt("dlab")}" value="${esc(r.l)}" oninput="DF['${a.id}'].r[${i}].l=this.value"><input type="number" inputmode="numeric" placeholder="${tt("damt")}" value="${esc(r.a)}" oninput="DF['${a.id}'].r[${i}].a=this.value"></div>`).join("")+`<button class="btn" style="min-height:48px;margin-top:8px" onclick="sendDeal('${a.id}')">${tt("dsend")}</button><p class="mut">${tt("dnote")}</p></div>`}
function sendDeal(id){const a=S.apps.find(x=>x.id==id),f=DF[id],ms=f.r.filter(r=>+r.a>0).map(r=>({l:r.l||"",a:+r.a}));if(!ms.length){toast(tt("damt"));return}
upd(id,{deal:{terms:f.t||"",ms,total:ms.reduce((s,m)=>s+m.a,0),v:((a.deal&&a.deal.v)||0)+1},seenW:0});toast(t("saved"))}
function dealAct(id,k,v){const a=S.apps.find(x=>x.id==id);if(!a)return;upd(id,k=="wAgree"?{wAgree:v}:{[k]:inl(a,k).concat([v])})}
function dealDisp(id,own){const a=S.apps.find(x=>x.id==id),tx=(DS[id]||"").trim();if(!a||!tx)return;const j=S.jobs.find(x=>x.id==a.jobId)||{};
upd(id,own?{oDispute:tx}:{wDispute:tx});wr("reports",uid+"_"+id,{target:own?a.wid:j.owner||"",app:id,from:uid,text:tx,ts:Date.now()});DS[id]="";toast(tt("dok"))}
function dealBox(a,own){const d=a.deal;if(!d)return own&&a.status=="hired"?dealForm(a):"";
const ok=a.wAgree===d.v,done=dealDone(a),id=a.id,b=(fn,l)=>`<button class="btn" style="min-height:44px;font-size:15px;margin-top:6px" onclick="${fn}">${l}</button>`;
const rows=d.ms.map((m,i)=>{const wd=inl(a,"wDone").includes(i),op=inl(a,"oPaid").includes(i),rc=inl(a,"wRecv").includes(i);let act="";
if(ok&&!own&&!wd)act=b(`dealAct('${id}','wDone',${i})`,tt("dwdone"));
if(ok&&own&&wd&&!op)act=b(`dealAct('${id}','oPaid',${i})`,tt("dpay"));
if(!own&&op&&!rc)act=b(`dealAct('${id}','wRecv',${i})`,tt("drecv"));
return`<div style="margin-top:8px;border-top:1px solid var(--line);padding-top:6px"><b>${esc(m.l)}</b> · ₹${esc(m.a)}<div class="mut">${wd?"✔ "+tt("dwdone")+" ":""}${op?"✔ "+tt("dpay")+" ":""}${rc?"✔ "+tt("drecv"):""}</div>${act}</div>`}).join("");
const ag=ok?"":(own?`<div class="mut">${tt("dwait")}</div>`:b(`dealAct('${id}','wAgree',${d.v})`,tt("dagree")));
const mine=own?a.oDispute:a.wDispute,theirs=own?a.wDispute:a.oDispute;
return`<div class="card" style="margin:8px 0"><b>${tt("deal")}</b> ${done?tt("ddone"):""}<div class="mut">${esc(d.terms||"")}</div><div>₹${esc(d.total)}</div>${rows}${ag}${theirs?`<div class="demo" style="margin-top:8px">⚠️ ${esc(theirs)}</div>`:""}${mine?`<div class="demo" style="margin-top:8px">⚠️ ${esc(mine)}</div>`:""}<input style="margin-top:8px" placeholder="${tt("ddt")}" oninput="DS['${id}']=this.value"><button class="btn alt" style="min-height:44px;font-size:15px;margin-top:6px" onclick="dealDisp('${id}',${own?1:0})">${tt("ddisp")}</button>${done?"":`<div class="mut" style="margin-top:6px">${tt("dlock")}</div>`}<p class="mut">${tt("dnote")}</p></div>`}
render();
</script>
